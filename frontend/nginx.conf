# Same-origin architecture: the browser talks to nginx, nginx proxies
# /api/ to the backend. React Router deep links fall back to index.html.
# Phase 17: runs as non-root (nginx-unprivileged), so it listens on 8080
# (mapped to host 80 in docker-compose.yml).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API (service name resolves on the Compose network).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers for the static dashboard (API headers come from Spring).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # React SPA: static assets first, everything else → index.html
    # so /research/new, /research/{id}, /history survive refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
