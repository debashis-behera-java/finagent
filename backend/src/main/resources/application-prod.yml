# ============================================================
# FINAGENT - prod profile (Phase 16)
# Real deployment settings. Activate with:
#   SPRING_PROFILES_ACTIVE=prod
# ALL secrets come from environment variables (see .env.example).
# ProductionSecretValidator refuses startup with defaults/placeholders.
# ============================================================
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY}

# Swagger fully off in production (OpenApiConfig bean + these switches
# + the security chain deny rule = three layers).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

finagent:
  research:
    enabled: true
  auth:
    enabled: true
    # Task 3: production serves HTTPS only — the refresh-token cookie must be
    # Secure (browsers drop non-Secure cookies flagged SameSite=None, and
    # Secure keeps the credential off plain-HTTP traffic entirely).
    cookie-secure: true
    # Task 4: housekeeping stays ON in production — stated explicitly so the
    # feature can never be silently disabled by a missing default. An operator
    # may still turn it off deliberately via FINAGENT_AUTH_REFRESH_CLEANUP_ENABLED=false.
    refresh-token:
      cleanup-enabled: true
  swagger:
    enabled: false

logging:
  level:
    com.finagent: INFO
