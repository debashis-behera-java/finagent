# ============================================================
# FINAGENT — reproducible local stack (Phase 12)
#
#   docker compose up --build
#
# Services: postgres 16 → Spring Boot backend → nginx-hosted React.
# MCP stays in-process inside the backend (no separate container).
# Secrets come from `.env` (copy `.env.example` first); the file is
# optional at compose time and NEVER baked into images.
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finagent
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-finagent}
      # Development-only fallback; set SPRING_DATASOURCE_PASSWORD in .env.
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-finagent-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME:-finagent} -d finagent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finagent
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-finagent}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-finagent-dev-only}
      # Boots without a key (deterministic stubs); set a real key in .env for AI synthesis.
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY:-test-dummy-key-not-real}
      FINAGENT_CORS_ALLOWED_ORIGINS: ${FINAGENT_CORS_ALLOWED_ORIGINS:-http://localhost}
      FINAGENT_MCP_ENABLED: ${FINAGENT_MCP_ENABLED:-true}
    ports:
      - "8080:8080"
    healthcheck:
      # Actuator exposes only health/info (see application.yml).
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Empty → same-origin /api via nginx (no CORS involved).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Host 80 → container 8080 (Phase 17: non-root nginx-unprivileged).
      - "80:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
